<svg xmlns="http://www.w3.org/2000/svg" viewBox="55 20 290 210" fill="none">
  <defs>
    <linearGradient id="brushGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e0d8"/>
      <stop offset="40%" stop-color="#f5f0ea"/>
      <stop offset="70%" stop-color="#c8956a"/>
      <stop offset="100%" stop-color="#e8d5c0"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(230,160,60,0)"/>
      <stop offset="30%" stop-color="#e8a040"/>
      <stop offset="50%" stop-color="#f0b050"/>
      <stop offset="70%" stop-color="#e8a040"/>
      <stop offset="100%" stop-color="rgba(230,160,60,0)"/>
    </linearGradient>
  </defs>

  <!-- "3" brush stroke -->
  <g transform="translate(100, 30)">
    <!-- Main curve of 3 -->
    <path d="M10,20 C10,8 25,2 45,4 C65,6 78,15 80,28 C82,42 68,52 52,55
             C68,58 85,68 83,85 C81,105 62,118 40,120 C22,122 8,115 4,105"
          stroke="url(#brushGrad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Brush texture strokes on 3 -->
    <path d="M15,18 C20,10 35,5 50,6" stroke="#f0e8e0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M75,30 C72,42 62,50 52,54" stroke="#c89060" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M55,58 C72,62 80,75 78,88" stroke="#d4a070" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- "6" brush stroke -->
  <g transform="translate(195, 30)">
    <!-- Main body of 6 -->
    <path d="M75,15 C55,5 30,8 18,30 C6,52 4,75 8,90 C12,108 28,120 48,120
             C68,120 82,108 84,90 C86,72 74,58 55,56 C36,54 20,62 14,78"
          stroke="url(#brushGrad)" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Brush texture on 6 -->
    <path d="M70,18 C52,10 35,12 25,25" stroke="#f0e8e0" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M18,45 C14,60 10,78 12,92" stroke="#c89060" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M30,115 C45,118 65,112 78,95" stroke="#d4a070" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- Inner circle detail -->
    <path d="M25,80 C28,65 42,58 56,62 C70,66 76,78 72,90 C68,102 54,110 42,108"
          stroke="#e0d0c0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- Heartbeat / pulse line -->
  <g transform="translate(0, 160)">
    <path d="M60,12 L145,12 L155,-8 L165,30 L175,-15 L185,25 L195,0 L205,12 L340,12"
          stroke="url(#pulseGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glow effect -->
    <path d="M60,12 L145,12 L155,-8 L165,30 L175,-15 L185,25 L195,0 L205,12 L340,12"
          stroke="#f0b050" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
  </g>

  <!-- "COLLECTIVE" text -->
  <text x="200" y="215" text-anchor="middle"
        font-family="'Montserrat', 'Helvetica Neue', Arial, sans-serif"
        font-size="24" font-weight="300" letter-spacing="8"
        fill="#e8e0d8">COLLECTIVE</text>
</svg>
